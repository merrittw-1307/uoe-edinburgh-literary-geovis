const NEUTRAL = "#5B6B8C";
const LAT_MIN=55.85, LAT_MAX=56.02, LON_MIN=-3.35, LON_MAX=-3.05;
const DEFAULT_CENTER = [55.945, -3.192];
const DEFAULT_ZOOM = 11;

const grid = document.getElementById('grid');
const letters = Object.keys(data).sort();

letters.forEach(letter => {
  const places = data[letter].filter(d =>
    d.lat >= LAT_MIN && d.lat <= LAT_MAX && d.lon >= LON_MIN && d.lon <= LON_MAX
  );
  const maxCount = Math.max(...data[letter].map(d => d.mention_count));
  const totalMentions = data[letter].reduce((s,d) => s + d.mention_count, 0);

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.style.width = '320px';

  const title = document.createElement('div');
  title.className = 'panel-title';
  title.textContent = 'Map ' + letter;
  panel.appendChild(title);

  const mapWrap = document.createElement('div');
  mapWrap.style.width = '320px';
  mapWrap.style.height = '260px';
  const mapId = 'map-' + letter;
  mapWrap.id = mapId;
  panel.appendChild(mapWrap);
  grid.appendChild(panel);

  const map = L.map(mapId, {
    center: DEFAULT_CENTER, zoom: DEFAULT_ZOOM,
    zoomControl: true, attributionControl: false
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 18
  }).addTo(map);

  places.forEach(d => {
    const r = Math.max(Math.log1p(d.mention_count / maxCount * 100) * 3.0, 3);
    const pct = (d.mention_count / totalMentions * 100).toFixed(1);
    const marker = L.circleMarker([d.lat, d.lon], {
      radius: r, fillColor: NEUTRAL, color: 'white', weight: 1.5, fillOpacity: 0.75
    });
    marker.bindPopup(`
      <div class="popup-inner">

        <div class="popup-count">${d.mention_count} mentions</div>
        <div class="popup-pct">${pct}% of total &middot; ${d.sector}</div>
      </div>`, { closeButton: false, offset: [0, -r] });
    marker.on('mouseover', function() { this.openPopup(); });
    marker.on('mouseout', function() { this.closePopup(); });
    marker.addTo(map);
  });
