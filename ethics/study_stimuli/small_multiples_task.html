t": "I was thus in the poorest of spirits, though still pretty resolved, when I came in view of Pilrig, a pleasant gabled house set by the walkside among some brave young woods. The laird's horse was standing saddled at the\u2026", "book": "Catriona"}, {"text": "You are not to suppose my education was neglected, on the contrary I was kept extremely busy. I studied the French, so as to be more prepared to go to Leyden ; I set myself to the fencing, and wrought hard, sometimes\u2026", "book": "David Balfour"}, {"text": "1892 Walk, Leith, Pilrig, Lochend, Figgate Whins, And I ^^' '^^ would like a piece in a corner, giving for the same period Figgate Whins, Musselburgh, Inveresk, Prestonpans, battlefield of Gladsmuir, Cockenzie, Gullane\u2026", "book": "Letters and Miscellanies of Robert Louis Stevenson, new letters"}]}, {"place": "St Giles", "lat": 55.9493396, "lon": -3.1905294, "mention_count": 18, "sector": "Old Town", "books": [{"title": "Edinburgh: picturesque notes", "count": 16}, {"title": "Lay morals, and other papers", "count": 2}], "sentences": [{"text": "Nor was the vision unsuitable to the locality ; for after an hospital, what uglier piece is there in civilisation than a court of law ? Hither come envy, malice and all uncharitableness to wrestle it out in public\u2026", "book": "Edinburgh: picturesque notes"}, {"text": "THE PARLIAMENT CLOSE. Time has wrought its changes most notably around the precinct of St. Giles's Church- The church itself, if it were not for the spire, would be unrecognisable ; the K mines are all gone, not a shop\u2026", "book": "Edinburgh: picturesque notes"}, {"text": "Perhaps he wandered down into the land of Thomas the Rhymer, and some day, when it is least expected, may take a thought to revisit the sunlit upper world. That will be a strange moment for the cabmen on the stance\u2026", "book": "Edinburgh: picturesque notes"}]}, {"place": "Randolph Crescent", "lat": 55.951934, "lon": -3.211707, "mention_count": 16, "sector": "New Town", "books": [{"title": "The Misadventures of John Nicholson", "count": 14}, {"title": "The Wrecker", "count": 2}], "sentences": [{"text": "Between these two considerations, at least, he was more than usually moved; and when he got to Randolph Crescent, he quite forgot the four hundred pounds in the inner pocket of his great-coat, hung up the coat, with its\u2026", "book": "The Misadventures of John Nicholson"}, {"text": "glass, which had been recently occluded by the figure of the jarvey, he beheld the tree-tops of the rookery in Randolph Crescent. He was close to home home, where he had thought, at that hour, to be sitting in the\u2026", "book": "The Misadventures of John Nicholson"}, {"text": "Alexander, the younger brother, was sickly, clever, fond of books and drawing, and full of satirical remarks. In the midst of these, imagine that natural, clumsy, unintelligent, and mirthful animal, John; mighty\u2026", "book": "The Misadventures of John Nicholson"}]}]};

function calcRadius(count, maxCount) {
  if (scaleMode === 'log') {
    return Math.max(Math.log1p(count / maxCount * 100) * 3.8, 3);
  } else {
    return Math.max((count / maxCount) * 22, 3);
  }
}

function buildMarkers(author) {
  const places = data[author].filter(d =>
    d.lat >= LAT_MIN && d.lat <= LAT_MAX &&
    d.lon >= LON_MIN && d.lon <= LON_MAX &&
    activeSectors.has(d.sector)

  const color = colors[author];
  const maxCount = Math.max(...data[author].map(d => d.mention_count));
  const totalMentions = data[author].reduce((s, d) => s + d.mention_count, 0);

  const layer = L.layerGroup();

  places.forEach(d => {
    const r = calcRadius(d.mention_count, maxCount);
    const pct = (d.mention_count / totalMentions * 100).toFixed(1);
    const marker = L.circleMarker([d.lat, d.lon], {
      radius: r,
      fillColor: color,
      color: 'white',
      weight: 1.5,
      fillOpacity: 0.75
    });

    marker.bindPopup(`
      <div class="popup-inner">
        <div class="popup-place" style="color:${color}">${d.place}</div>
        <div class="popup-count">${d.mention_count} mentions</div>
        <div class="popup-pct">${pct}% of total · ${d.sector}</div>
      </div>`, {
      closeButton: false,
      offset: [0, -r]
    });

    marker.on('mouseover', function() { this.openPopup(); });
    marker.on('mouseout', function() { this.closePopup(); });
    marker.on('click', function() {
      this.openPopup();
      marker.off('mouseout');
      marker.on('mouseout', function(){});
    });

    layer.addLayer(marker);
  });

  return layer;
}

function refreshMarkers() {
  Object.keys(maps).forEach(author => {
    const map = maps[author];
    if (markerLayers[author]) map.removeLayer(markerLayers[author]);
    markerLayers[author] = buildMarkers(author);
    markerLayers[author].addTo(map);
  });
}

function teardownMaps() {
  Object.values(maps).forEach(map => map.remove());
  for (const k in maps) delete maps[k];
  for (const k in markerLayers) delete markerLayers[k];
}

function buildGrid(authorsToShow, panelW, panelH) {
  teardownMaps();
  document.getElementById('grid').innerHTML = '';

  authorsToShow.forEach(author => {
    const places = data[author].filter(d =>
      d.lat >= LAT_MIN && d.lat <= LAT_MAX && d.lon >= LON_MIN && d.lon <= LON_MAX
    );
    const totalMentions = data[author].reduce((s,d) => s+d.mention_count, 0);
    const color = colors[author];

    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.style.width = panelW + 'px';

    const titleDiv = document.createElement('div');
    titleDiv.className = 'panel-title';
    titleDiv.innerHTML = `
      <span class="panel-stats">${places.length} places · ${totalMentions.toLocaleString()} mentions</span>`;
    panel.appendChild(titleDiv);

    const mapWrap = document.createElement('div');
    mapWrap.style.width = panelW + 'px';
    mapWrap.style.height = panelH + 'px';
    const mapId = 'map-' + author.replace(/\s+/g,'-');
    mapWrap.id = mapId;
    panel.appendChild(mapWrap);
    document.getElementById('grid').appendChild(panel);

    const map = L.map(mapId, {
      center: DEFAULT_CENTER,
      zoom: DEFAULT_ZOOM,
      zoomControl: true,
      attributionControl: false
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 18
    }).addTo(map);

    maps[author] = map;

    map.on('moveend zoomend', function() {
      if (!syncMode || isSyncing) return;
      isSyncing = true;
      const center = map.getCenter();
      const zoom = map.getZoom();
      authorsToShow.forEach(a => {
        if (a !== author) maps[a].setView(center, zoom, {animate: false});
      });
      isSyncing = false;
    });
  });

  refreshMarkers();
}

// Sector legend
const legendDiv = document.getElementById('sector-legend');
usedSectors.forEach(s => {
  const tag = document.createElement('div');
  tag.className = 'sector-tag';
  tag.style.background = sectorColors[s] || '#999';
  tag.textContent = s;
  tag.dataset.sector = s;
  tag.addEventListener('click', () => {
    if (activeSectors.has(s)) {
      activeSectors.delete(s);
      tag.classList.add('muted');
    } else {
      activeSectors.add(s);
      tag.classList.remove('muted');
    }
    refreshMarkers();
  });
  legendDiv.appendChild(tag);
});

buildGrid(authorOrder, 640, 460);

// Controls
document.getElementById('btn-log').addEventListener('click', () => {
  scaleMode = 'log';
  document.getElementById('btn-log').classList.add('active');
  document.getElementById('btn-linear').classList.remove('active');
  refreshMarkers();
});
document.getElementById('btn-linear').addEventListener('click', () => {
  scaleMode = 'linear';
  document.getElementById('btn-linear').classList.add('active');
  document.getElementById('btn-log').classList.remove('active');
  refreshMarkers();
});
document.getElementById('btn-reset').addEventListener('click', () => {
  Object.keys(maps).forEach(a => maps[a].setView(DEFAULT_CENTER, DEFAULT_ZOOM));
});
</script>
